<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindTree</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f0;
  --panel-bg: #ffffff;
  --text: #333;
  --text-dim: #999;
  --border: #e0e0e0;
  --accent: #4a9d6f;
  --shadow: 0 2px 12px rgba(0,0,0,0.1);
  /* Branch palette - Coggle-like warm tones */
  --c0: #e8735a; /* root warm red */
  --c1: #e8a23a;
  --c2: #6db56d;
  --c3: #5a9fd4;
  --c4: #a06db5;
  --c5: #d45a9f;
  --c6: #5ab5b5;
  --c7: #b5a05a;
}

html, body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Noto Sans SC',sans-serif; overflow:hidden; }

/* ── LIST VIEW ── */
#list-view {
  width:100%; height:100%;
  display:flex; flex-direction:column; align-items:center;
  overflow-y:auto; padding:48px 24px 40px;
  background: var(--bg);
}

.list-top {
  width:100%; max-width:640px;
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:32px;
}

.list-logo {
  font-size:1.4rem; font-weight:500; color:#555;
  letter-spacing:0.02em;
}
.list-logo span { color:var(--c0); }

.new-btn {
  display:flex; align-items:center; gap:8px;
  background: var(--c0); color:#fff;
  border:none; padding:9px 20px; border-radius:20px;
  cursor:pointer; font-family:'Noto Sans SC',sans-serif;
  font-size:0.88rem; font-weight:500;
  transition:filter 0.15s; box-shadow: 0 2px 8px rgba(232,115,90,0.35);
}
.new-btn:hover { filter:brightness(1.08); }

.maps-grid { width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px; }

.map-card {
  background:var(--panel-bg); border:1px solid var(--border);
  border-radius:10px; padding:16px 18px;
  cursor:pointer; transition:all 0.18s;
  display:flex; align-items:center; gap:14px;
}
.map-card:hover { box-shadow:var(--shadow); border-color:#ccc; transform:translateY(-1px); }

.map-card-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.map-card-title { font-size:0.95rem; font-weight:500; color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.map-card-meta { font-size:0.75rem; color:var(--text-dim); white-space:nowrap; flex-shrink:0; }
.map-card-del { background:none; border:none; color:#ccc; cursor:pointer; padding:4px; border-radius:4px; display:flex; transition:color 0.15s; }
.map-card-del:hover { color:#e87; }

.empty-state { text-align:center; color:var(--text-dim); font-size:0.85rem; padding:60px 0; }

/* ── EDITOR VIEW ── */
#editor-view { display:none; width:100%; height:100%; flex-direction:column; }

.editor-nav {
  height:48px; background:var(--panel-bg);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; padding:0 16px; gap:10px;
  flex-shrink:0; z-index:200;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.nav-back {
  background:none; border:none; color:#999; cursor:pointer;
  padding:5px 8px; border-radius:6px; display:flex; align-items:center;
  gap:5px; font-size:0.82rem; font-family:'Noto Sans SC',sans-serif;
  transition:color 0.15s;
}
.nav-back:hover { color:#555; }

#map-title-input {
  flex:1; background:none; border:none; color:var(--text);
  font-family:'Noto Sans SC',sans-serif; font-size:0.95rem;
  font-weight:500; outline:none;
}
#map-title-input::placeholder { color:#bbb; }

.nav-actions { display:flex; gap:6px; align-items:center; }

.nav-btn {
  display:flex; align-items:center; gap:5px;
  background:none; border:1px solid var(--border);
  color:#888; padding:5px 12px; border-radius:16px;
  cursor:pointer; font-family:'Noto Sans SC',sans-serif;
  font-size:0.75rem; transition:all 0.15s;
}
.nav-btn:hover { border-color:#aaa; color:#555; }

.save-dot {
  width:7px; height:7px; border-radius:50%;
  background:#ccc; flex-shrink:0; transition:background 0.3s;
}
.save-dot.saved { background:#6db56d; }
.save-dot.unsaved { background:#e8a23a; }

/* ── CANVAS ── */
#canvas-wrap {
  flex:1; overflow:hidden; position:relative;
  cursor:default; user-select:none;
  background: radial-gradient(circle at 50% 50%, #fafafa 0%, #f0f0eb 100%);
}

#canvas {
  position:absolute; top:0; left:0;
  transform-origin:0 0;
}

svg#connections {
  position:absolute; top:0; left:0;
  width:200000px; height:200000px;
  pointer-events:none; overflow:visible;
}

/* ── NODES ── */
.node {
  position:absolute;
  cursor:pointer;
  transform:translate(-50%, -50%);
}

/* Root node: Coggle-style arrow label */
.node-root-box {
  display:flex; align-items:center;
  background:#616161; color:#fff;
  font-size:1rem; font-weight:500;
  padding:8px 18px 8px 16px;
  border-radius:4px;
  position:relative;
  white-space:nowrap;
  min-width:80px;
  cursor:text;
}
/* Arrow tip on right */
.node-root-box::after {
  content:'';
  position:absolute; right:-10px; top:50%;
  transform:translateY(-50%);
  border:10px solid transparent;
  border-left:10px solid #616161;
  border-right:none;
}
.node-root-box.editing { outline:none; }

/* Branch/leaf nodes: just text, colored */
.node-label {
  font-size:0.92rem; font-weight:400;
  padding:3px 0;
  white-space:nowrap;
  cursor:text;
  position:relative;
  line-height:1.4;
}

/* Hover add button: little circle on the end of the line */
.node-add-btn {
  position:absolute;
  width:18px; height:18px;
  border-radius:50%;
  border:2px solid currentColor;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:bold; line-height:1;
  cursor:pointer;
  opacity:0;
  transition:opacity 0.15s;
  pointer-events:all;
  right:-24px; top:50%; transform:translateY(-50%);
}
.node:hover .node-add-btn { opacity:1; }

/* Note dot */
.note-dot {
  position:absolute; top:-4px; right:-4px;
  width:8px; height:8px; border-radius:50%;
  background:#e8a23a; border:1.5px solid #fff;
  pointer-events:none;
}

/* Note tooltip */
.note-tip {
  position:absolute; bottom:calc(100% + 8px); left:50%;
  transform:translateX(-50%);
  background:#fff; border:1px solid #e0e0e0;
  border-radius:8px; padding:8px 12px;
  font-size:0.78rem; color:#666; max-width:220px;
  white-space:pre-wrap; word-break:break-word;
  box-shadow:0 4px 16px rgba(0,0,0,0.1);
  pointer-events:none; opacity:0;
  transition:opacity 0.15s; z-index:100;
  text-align:left;
}
.node:hover .note-tip { opacity:1; }

/* ── CONTEXT MENU ── */
#ctx-menu {
  position:fixed; background:#fff;
  border:1px solid #e8e8e8; border-radius:10px;
  box-shadow:0 4px 20px rgba(0,0,0,0.12);
  min-width:160px; z-index:9999;
  display:none; overflow:hidden;
}
#ctx-menu.on { display:block; animation:popIn 0.1s ease; }
@keyframes popIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }

.ctx-item {
  padding:10px 16px; font-size:0.85rem;
  cursor:pointer; color:#555;
  display:flex; align-items:center; gap:10px;
  transition:background 0.1s;
}
.ctx-item:hover { background:#f7f7f7; color:#333; }
.ctx-item.red:hover { color:#e87; }
.ctx-sep { height:1px; background:#f0f0f0; margin:3px 0; }

/* ── MODALS ── */
.overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.35);
  display:none; align-items:center; justify-content:center;
  z-index:10000; backdrop-filter:blur(2px);
}
.overlay.on { display:flex; }

.modal {
  background:#fff; border-radius:14px;
  padding:28px 26px; width:400px;
  box-shadow:0 8px 40px rgba(0,0,0,0.15);
  animation:popIn 0.15s ease;
}
.modal h3 { font-size:1rem; font-weight:500; color:#333; margin-bottom:18px; }

.modal-input {
  width:100%; border:1px solid #ddd; border-radius:8px;
  padding:10px 13px; font-family:'Noto Sans SC',sans-serif;
  font-size:0.9rem; color:#333; outline:none;
  transition:border-color 0.2s; margin-bottom:14px; display:block;
}
.modal-input:focus { border-color:#aaa; }
textarea.modal-input { resize:vertical; min-height:100px; line-height:1.6; }
.modal-char { font-size:0.7rem; color:#bbb; text-align:right; margin-top:-8px; margin-bottom:14px; }

.modal-btns { display:flex; gap:8px; justify-content:flex-end; align-items:center; }
.mbtn {
  padding:8px 20px; border-radius:20px; border:none;
  cursor:pointer; font-family:'Noto Sans SC',sans-serif;
  font-size:0.85rem; transition:all 0.15s;
}
.mbtn-cancel { background:#f5f5f5; color:#888; }
.mbtn-cancel:hover { background:#eee; }
.mbtn-ok { background:var(--c0); color:#fff; font-weight:500; box-shadow:0 2px 8px rgba(232,115,90,0.3); }
.mbtn-ok:hover { filter:brightness(1.08); }
.mbtn-del { background:none; border:1px solid #f5c0b0; color:#e87; margin-right:auto; }
.mbtn-del:hover { background:#fff5f3; }

/* Export overlay */
#exp-overlay {
  position:fixed; inset:0; background:rgba(255,255,255,0.8);
  display:none; align-items:center; justify-content:center;
  z-index:10000;
}
#exp-overlay.on { display:flex; }
.exp-msg { color:#888; font-size:0.9rem; }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#ddd; border-radius:3px; }
</style>
</head>
<body>

<!-- LIST VIEW -->
<div id="list-view">
  <div class="list-top">
    <div class="list-logo">Mind<span>Tree</span></div>
    <button class="new-btn" onclick="showNewModal()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>
      新建导图
    </button>
  </div>
  <div class="maps-grid" id="maps-grid">
    <div class="empty-state">还没有导图，点击右上角新建一张</div>
  </div>
</div>

<!-- EDITOR VIEW -->
<div id="editor-view">
  <div class="editor-nav">
    <button class="nav-back" onclick="backToList()">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      全部导图
    </button>
    <input id="map-title-input" type="text" placeholder="导图标题..." oninput="onTitleChange()">
    <div class="nav-actions">
      <button class="nav-btn" onclick="autoLayout(true)">整理布局</button>
      <button class="nav-btn" onclick="exportPNG()">导出 PNG</button>
      <button class="nav-btn" onclick="exportPDF()">导出 PDF</button>
      <div class="save-dot saved" id="save-dot" title="已保存"></div>
    </div>
  </div>
  <div id="canvas-wrap">
    <div id="canvas">
      <svg id="connections"></svg>
    </div>
  </div>
</div>

<!-- New Map Modal -->
<div class="overlay" id="overlay-new">
  <div class="modal">
    <h3>新建思维导图</h3>
    <input id="new-title-input" class="modal-input" type="text" placeholder="给这张导图起个名字..." maxlength="40">
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="hideNewModal()">取消</button>
      <button class="mbtn mbtn-ok" onclick="confirmNew()">创建</button>
    </div>
  </div>
</div>

<!-- Note Modal -->
<div class="overlay" id="overlay-note">
  <div class="modal">
    <h3>节点备注</h3>
    <textarea id="note-input" class="modal-input" placeholder="输入备注内容..." maxlength="500" rows="5" oninput="updateNoteChar()"></textarea>
    <div class="modal-char" id="note-char">0 / 500</div>
    <div class="modal-btns">
      <button class="mbtn mbtn-del" onclick="clearNote()">清除备注</button>
      <button class="mbtn mbtn-cancel" onclick="hideNoteModal()">取消</button>
      <button class="mbtn mbtn-ok" onclick="saveNote()">保存</button>
    </div>
  </div>
</div>

<!-- Context Menu -->
<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxAdd()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    添加子节点
  </div>
  <div class="ctx-item" onclick="ctxEdit()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 9.5L9 2.5l1.5 1.5-7 7H2V9.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    编辑文字
  </div>
  <div class="ctx-item" onclick="ctxNote()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1.5" y="1.5" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M3.5 4.5h6M3.5 6.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    编辑备注
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item red" onclick="ctxDel()">
    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M4.5 3.5V2.5h4v1M5 5.5v4M8 5.5v4M2.5 3.5l.8 7h6.4l.8-7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    删除节点
  </div>
</div>

<!-- Export overlay -->
<div id="exp-overlay">
  <div class="exp-msg" id="exp-msg">正在生成...</div>
</div>

<script>
// ── PALETTE ── (Coggle-style warm branch colors)
const PALETTE = ['#e8735a','#e8a23a','#6db56d','#5a9fd4','#a06db5','#d45a9f','#5ab5b5','#b5a05a'];

// ── STATE ──
let currentMapId = null, mapData = null;
let selectedId = null, ctxId = null, noteId = null;
let saveTimer = null, isDirty = false;
let nodeEls = {}, nodeData = {}; // id -> element, id -> data object

// Canvas transform
let cx = 0, cy = 0, cz = 1;
let panning = false, px0 = 0, py0 = 0, pcx = 0, pcy = 0;
// Node drag
let dragging = false, dragId = null, dx0 = 0, dy0 = 0, dnx = 0, dny = 0;

// ── UTILS ──
function uid() { return 'n' + Math.random().toString(36).slice(2, 9); }
function fmtDate(ts) {
  const d = new Date(ts * 1000);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function branchColor(branchIndex) { return PALETTE[branchIndex % PALETTE.length]; }

// ── API ──
const api = {
  get: p => fetch(p).then(r => r.json()),
  post: (p,b) => fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
  put: (p,b) => fetch(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
  del: p => fetch(p,{method:'DELETE'}).then(r=>r.json()),
};

// ── LIST ──
async function loadList() {
  const maps = await api.get('/api/maps');
  const grid = document.getElementById('maps-grid');
  if (!maps.length) {
    grid.innerHTML = '<div class="empty-state">还没有导图，点击右上角新建一张</div>';
    return;
  }
  grid.innerHTML = maps.map((m, i) => `
    <div class="map-card" onclick="openMap(${m.id})">
      <div class="map-card-dot" style="background:${PALETTE[i % PALETTE.length]}"></div>
      <div class="map-card-title">${esc(m.title)}</div>
      <div class="map-card-meta">${fmtDate(m.updated_at)}</div>
      <button class="map-card-del" onclick="event.stopPropagation();delMap(${m.id},this.closest('.map-card'))">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 3.5h9M4.5 3.5V2.5h4v1M5 5.5v4M8 5.5v4M2.5 3.5l.8 7h6.4l.8-7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>`).join('');
}

async function delMap(id, card) {
  if (!confirm('确定删除这张导图？')) return;
  await api.del(`/api/maps/${id}`);
  card.remove();
  if (!document.querySelector('.map-card'))
    document.getElementById('maps-grid').innerHTML = '<div class="empty-state">还没有导图，点击右上角新建一张</div>';
}

// ── NEW MAP MODAL ──
function showNewModal() {
  document.getElementById('new-title-input').value = '';
  document.getElementById('overlay-new').classList.add('on');
  setTimeout(() => document.getElementById('new-title-input').focus(), 60);
}
function hideNewModal() { document.getElementById('overlay-new').classList.remove('on'); }
async function confirmNew() {
  const t = document.getElementById('new-title-input').value.trim() || '未命名导图';
  hideNewModal();
  const m = await api.post('/api/maps', { title: t });
  openMap(m.id);
}
document.getElementById('new-title-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmNew();
  if (e.key === 'Escape') hideNewModal();
});
document.getElementById('overlay-new').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay-new')) hideNewModal();
});

// ── OPEN MAP ──
async function openMap(id) {
  currentMapId = id;
  const m = await api.get(`/api/maps/${id}`);
  mapData = typeof m.data === 'string' ? JSON.parse(m.data) : m.data;
  if (!mapData || !mapData.id) {
    mapData = { id: uid(), text: m.title, x: 0, y: 0, children: [], note: '' };
  }
  document.getElementById('map-title-input').value = m.title;
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('editor-view').style.display = 'flex';
  setSaved(true);

  // Center
  const wrap = document.getElementById('canvas-wrap');
  cz = 1; cx = wrap.clientWidth / 2; cy = wrap.clientHeight / 2;
  applyTransform();
  // Auto-layout if nodes lack position (new map or legacy data)
  const hasPos = mapData.x !== undefined && mapData.x !== 0;
  if (!hasPos) {
    autoLayout(false);
  } else {
    renderAll();
  }
}

function backToList() {
  if (isDirty) saveNow();
  document.getElementById('editor-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'flex';
  currentMapId = null; mapData = null; selectedId = null; nodeEls = {}; nodeData = {}; isDirty = false;
  loadList();
}

function onTitleChange() { markDirty(); }

// ── RENDER ──
// Assign branch colors: each direct child of root gets a color
function assignColors(node, color, depth) {
  node._color = color;
  node._depth = depth;
  if (node.children) {
    node.children.forEach((c, i) => {
      const col = depth === 0 ? PALETTE[i % PALETTE.length] : color;
      assignColors(c, col, depth + 1);
    });
  }
}

function renderAll() {
  const canvas = document.getElementById('canvas');
  canvas.querySelectorAll('.node').forEach(e => e.remove());
  nodeEls = {}; nodeData = {};
  document.getElementById('connections').innerHTML = '';
  if (!mapData) return;
  assignColors(mapData, PALETTE[0], 0);
  flattenTree(mapData, nodeData);
  renderNode(mapData);
  drawAllLines(mapData);
}

function flattenTree(node, map) {
  map[node.id] = node;
  if (node.children) node.children.forEach(c => flattenTree(c, map));
}

function renderNode(node) {
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = node.id;
  el.style.left = (node.x || 0) + 'px';
  el.style.top = (node.y || 0) + 'px';

  const color = node._color || PALETTE[0];
  const isRoot = node._depth === 0;

  if (isRoot) {
    // Coggle-style arrow label
    const box = document.createElement('div');
    box.className = 'node-root-box';
    box.textContent = node.text || '主题';
    el.appendChild(box);
  } else {
    // Plain colored text
    const lbl = document.createElement('div');
    lbl.className = 'node-label';
    lbl.style.color = color;
    lbl.style.borderBottom = `2px solid ${color}`;
    lbl.style.paddingBottom = '1px';
    lbl.textContent = node.text || '节点';
    el.appendChild(lbl);
  }

  // Note dot & tooltip
  if (node.note) {
    const dot = document.createElement('div'); dot.className = 'note-dot'; el.appendChild(dot);
    const tip = document.createElement('div'); tip.className = 'note-tip'; tip.textContent = node.note; el.appendChild(tip);
  }

  // Add child button
  if (!isRoot) {
    const addBtn = document.createElement('div');
    addBtn.className = 'node-add-btn';
    addBtn.style.color = color;
    addBtn.textContent = '+';
    addBtn.addEventListener('click', e => { e.stopPropagation(); addChild(node.id); });
    el.appendChild(addBtn);
  }

  // Events
  el.addEventListener('mousedown', e => onNodeMD(e, node.id));
  el.addEventListener('click', e => { e.stopPropagation(); selectNode(node.id); });
  el.addEventListener('dblclick', e => { e.stopPropagation(); startEdit(node.id); });
  el.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showCtx(e, node.id); });

  document.getElementById('canvas').appendChild(el);
  nodeEls[node.id] = el;

  if (node.children) node.children.forEach(c => renderNode(c));
}

// ── CONNECTIONS ── Coggle uses smooth curved lines from parent center to child
function drawAllLines(node) {
  if (!node.children) return;
  node.children.forEach(c => {
    drawLine(node, c);
    drawAllLines(c);
  });
}

function drawLine(parent, child) {
  const svg = document.getElementById('connections');
  const pEl = nodeEls[parent.id], cEl = nodeEls[child.id];
  if (!pEl || !cEl) return;

  const color = child._color || PALETTE[0];
  const pw = pEl.offsetWidth, ph = pEl.offsetHeight;
  const cw = cEl.offsetWidth, ch = cEl.offsetHeight;

  // From right-center of parent to left-center of child (or adjust based on position)
  const px1 = parent.x + pw / 2, py1 = parent.y;
  const cx1 = child.x + cw / 2, cy1 = child.y;

  // Coggle-style: thick curved line, tapering
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const mx = (px1 + cx1) / 2;

  // Control points for S-curve like Coggle
  const d = `M ${px1} ${py1} C ${mx} ${py1}, ${mx} ${cy1}, ${cx1} ${cy1}`;
  path.setAttribute('d', d);
  path.setAttribute('stroke', color);

  // Thicker near root, thinner for deep nodes
  const depth = child._depth || 1;
  const sw = Math.max(1.5, 4 - depth * 0.8);
  path.setAttribute('stroke-width', sw);
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('opacity', '0.85');
  svg.appendChild(path);
}

// ── SELECTION ──
function selectNode(id) {
  document.querySelectorAll('.node').forEach(n => n.style.outline = 'none');
  selectedId = id;
  if (id && nodeEls[id]) {
    nodeEls[id].style.outline = '2px dashed ' + (nodeData[id]?._color || '#aaa');
    nodeEls[id].style.outlineOffset = '3px';
    nodeEls[id].style.borderRadius = '4px';
  }
}

// ── EDIT ──
function startEdit(id) {
  const node = nodeData[id]; if (!node) return;
  const el = nodeEls[id];
  const lbl = el.querySelector('.node-root-box, .node-label');
  lbl.contentEditable = 'true'; lbl.focus();
  const r = document.createRange(); r.selectNodeContents(lbl);
  window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
  const finish = () => {
    lbl.contentEditable = 'false';
    node.text = lbl.textContent.trim() || '节点';
    lbl.textContent = node.text;
    markDirty();
    lbl.removeEventListener('blur', finish); lbl.removeEventListener('keydown', onKey);
  };
  const onKey = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); lbl.blur(); }
    if (e.key === 'Escape') { lbl.textContent = node.text; lbl.blur(); }
  };
  lbl.addEventListener('blur', finish); lbl.addEventListener('keydown', onKey);
}

// ── AUTO LAYOUT ──
const NODE_GAP_Y = 52;
const NODE_GAP_X = 180;

function subtreeHeight(node) {
  if (!node.children || node.children.length === 0) return 1;
  return node.children.reduce((sum, c) => sum + subtreeHeight(c), 0);
}

function layoutSubtree(node, x, topY) {
  const h = subtreeHeight(node);
  const centerY = topY + (h * NODE_GAP_Y) / 2;
  node.x = x;
  node.y = centerY;
  if (!node.children || node.children.length === 0) return;
  let curY = topY;
  node.children.forEach(c => {
    const ch = subtreeHeight(c);
    layoutSubtree(c, x + NODE_GAP_X, curY);
    curY += ch * NODE_GAP_Y;
  });
}

function autoLayout(andSave) {
  if (!mapData) return;
  const totalH = subtreeHeight(mapData);
  layoutSubtree(mapData, -NODE_GAP_X * 0.5, -(totalH * NODE_GAP_Y) / 2);
  if (andSave) markDirty();
  renderAll();
}

// ── ADD CHILD ──
function addChild(parentId) {
  const parent = nodeData[parentId]; if (!parent) return;
  const siblings = parent.children ? parent.children.length : 0;
  const child = {
    id: uid(), text: '新节点',
    x: parent.x + NODE_GAP_X,
    y: parent.y + siblings * NODE_GAP_Y,
    children: [], note: '',
  };
  if (!parent.children) parent.children = [];
  parent.children.push(child);
  autoLayout(true);
  selectNode(child.id);
  setTimeout(() => startEdit(child.id), 60);
}

// Right-click on root also adds
document.getElementById('canvas-wrap').addEventListener('dblclick', e => {
  if (!e.target.closest('.node') && mapData) addChild(mapData.id);
});

// ── DELETE ──
function delNode(id) {
  if (id === mapData.id) { alert('根节点无法删除'); return; }
  removeFromTree(mapData, id);
  if (selectedId === id) selectedId = null;
  markDirty(); renderAll();
}
function removeFromTree(node, id) {
  if (!node.children) return false;
  const i = node.children.findIndex(c => c.id === id);
  if (i !== -1) { node.children.splice(i, 1); return true; }
  return node.children.some(c => removeFromTree(c, id));
}

// ── CONTEXT MENU ──
function showCtx(e, id) {
  ctxId = id; selectNode(id);
  const menu = document.getElementById('ctx-menu');
  let lx = e.clientX, ly = e.clientY;
  if (lx + 180 > window.innerWidth) lx = window.innerWidth - 184;
  if (ly + 180 > window.innerHeight) ly = window.innerHeight - 184;
  menu.style.left = lx + 'px'; menu.style.top = ly + 'px';
  menu.classList.add('on');
}
function hideCtx() { document.getElementById('ctx-menu').classList.remove('on'); ctxId = null; }
function ctxAdd() { const id = ctxId; hideCtx(); addChild(id); }
function ctxEdit() { const id = ctxId; hideCtx(); startEdit(id); }
function ctxNote() { const id = ctxId; hideCtx(); showNoteModal(id); }
function ctxDel() { const id = ctxId; hideCtx(); delNode(id); }

// ── NOTE MODAL ──
function showNoteModal(id) {
  noteId = id;
  document.getElementById('note-input').value = nodeData[id]?.note || '';
  updateNoteChar();
  document.getElementById('overlay-note').classList.add('on');
  setTimeout(() => document.getElementById('note-input').focus(), 60);
}
function hideNoteModal() { document.getElementById('overlay-note').classList.remove('on'); noteId = null; }
function updateNoteChar() { const v = document.getElementById('note-input').value; document.getElementById('note-char').textContent = v.length + ' / 500'; }
function saveNote() {
  if (!noteId) return;
  nodeData[noteId].note = document.getElementById('note-input').value.trim();
  hideNoteModal(); markDirty(); renderAll(); selectNode(noteId);
}
function clearNote() {
  if (!noteId) return;
  nodeData[noteId].note = '';
  hideNoteModal(); markDirty(); renderAll();
}
document.getElementById('overlay-note').addEventListener('click', e => { if (e.target === document.getElementById('overlay-note')) hideNoteModal(); });
document.getElementById('note-input').addEventListener('keydown', e => { if (e.key === 'Escape') hideNoteModal(); });

// ── NODE DRAG ──
function onNodeMD(e, id) {
  if (e.button !== 0 || e.target.closest('[contenteditable="true"]') || e.target.classList.contains('node-add-btn')) return;
  const node = nodeData[id]; if (!node) return;
  dragging = false; dragId = id;
  dx0 = e.clientX; dy0 = e.clientY;
  dnx = node.x; dny = node.y;
  const onMove = e2 => {
    const ddx = (e2.clientX - dx0) / cz, ddy = (e2.clientY - dy0) / cz;
    if (Math.abs(ddx) > 3 || Math.abs(ddy) > 3) dragging = true;
    if (dragging) {
      node.x = dnx + ddx; node.y = dny + ddy;
      nodeEls[id].style.left = node.x + 'px';
      nodeEls[id].style.top = node.y + 'px';
      document.getElementById('connections').innerHTML = '';
      drawAllLines(mapData);
    }
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    if (dragging) { markDirty(); dragging = false; }
    dragId = null;
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  e.stopPropagation();
}

// ── CANVAS PAN / ZOOM ──
const wrap = document.getElementById('canvas-wrap');
wrap.addEventListener('mousedown', e => {
  if (e.button !== 0 || e.target.closest('.node')) return;
  panning = true; px0 = e.clientX; py0 = e.clientY; pcx = cx; pcy = cy;
  wrap.style.cursor = 'grabbing';
});
document.addEventListener('mousemove', e => {
  if (!panning) return;
  cx = pcx + (e.clientX - px0); cy = pcy + (e.clientY - py0); applyTransform();
});
document.addEventListener('mouseup', () => { if (panning) { panning = false; wrap.style.cursor = 'default'; } });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const nz = Math.min(4, Math.max(0.15, cz * delta));
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  cx = mx - (mx - cx) * (nz / cz); cy = my - (my - cy) * (nz / cz);
  cz = nz; applyTransform();
}, { passive: false });

function applyTransform() {
  document.getElementById('canvas').style.transform = `translate(${cx}px,${cy}px) scale(${cz})`;
}

// ── GLOBAL EVENTS ──
document.addEventListener('click', e => {
  if (!e.target.closest('#ctx-menu')) hideCtx();
  if (!e.target.closest('.node') && !e.target.closest('#ctx-menu')) selectNode(null);
});
document.addEventListener('contextmenu', e => { if (!e.target.closest('.node')) { hideCtx(); e.preventDefault(); } });
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, [contenteditable="true"]')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId) { e.preventDefault(); delNode(selectedId); }
  if (e.key === 'Tab') { e.preventDefault(); if (selectedId) addChild(selectedId); }
  if (e.key === 'F2' && selectedId) startEdit(selectedId);
  if ((e.key === 'n' || e.key === 'N') && selectedId) showNoteModal(selectedId);
  if (e.key === 'Enter' && selectedId && nodeData[selectedId]?._depth === 0) addChild(selectedId);
});

// ── EXPORT ──
function showExp(msg) { document.getElementById('exp-msg').textContent = msg; document.getElementById('exp-overlay').classList.add('on'); }
function hideExp() { document.getElementById('exp-overlay').classList.remove('on'); }

async function captureMap() {
  const canvas = document.getElementById('canvas');
  const orig = canvas.style.transform;
  canvas.style.transform = 'translate(0px,0px) scale(1)';
  await new Promise(r => setTimeout(r, 100));
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  document.querySelectorAll('.node').forEach(el => {
    const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
    const w = el.offsetWidth, h = el.offsetHeight;
    minX = Math.min(minX, x - w/2 - 8); minY = Math.min(minY, y - h/2 - 8);
    maxX = Math.max(maxX, x + w/2 + 8); maxY = Math.max(maxY, y + h/2 + 8);
  });
  const pad = 60;
  minX -= pad; minY -= pad; maxX += pad; maxY += pad;
  const img = await html2canvas(canvas, {
    backgroundColor:'#f5f5f0', scale:2,
    x:minX, y:minY, width:maxX-minX, height:maxY-minY,
    useCORS:true, logging:false,
    ignoreElements: el => el.classList.contains('node-add-btn') || el.classList.contains('note-tip'),
  });
  canvas.style.transform = orig;
  return { img, W: maxX - minX, H: maxY - minY };
}

async function exportPNG() {
  showExp('正在生成 PNG...');
  await new Promise(r => setTimeout(r, 50));
  try {
    const { img } = await captureMap();
    const title = (document.getElementById('map-title-input').value || 'mindtree').replace(/[\/\\:*?"<>|]/g,'_');
    const a = document.createElement('a'); a.href = img.toDataURL('image/png'); a.download = title + '.png'; a.click();
  } catch(err) { alert('导出失败：' + err.message); }
  hideExp();
}

async function exportPDF() {
  showExp('正在生成 PDF...');
  await new Promise(r => setTimeout(r, 50));
  try {
    const { img, W, H } = await captureMap();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: W > H ? 'landscape' : 'portrait', unit:'px', format:[W,H] });
    pdf.addImage(img.toDataURL('image/png'), 'PNG', 0, 0, W, H);
    const title = (document.getElementById('map-title-input').value || 'mindtree').replace(/[\/\\:*?"<>|]/g,'_');
    pdf.save(title + '.pdf');
  } catch(err) { alert('导出失败：' + err.message); }
  hideExp();
}

// ── SAVE ──
function markDirty() {
  isDirty = true; setSaved(false);
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1200);
}
async function saveNow() {
  if (!currentMapId || !mapData) return; isDirty = false;
  const title = document.getElementById('map-title-input').value.trim() || '未命名导图';
  mapData.text = title;
  await api.put(`/api/maps/${currentMapId}`, { title, data: JSON.stringify(mapData) });
  setSaved(true);
}
function setSaved(ok) {
  const dot = document.getElementById('save-dot');
  dot.className = 'save-dot ' + (ok ? 'saved' : 'unsaved');
  dot.title = ok ? '已保存' : '未保存';
}

// ── INIT ──
loadList();
</script>
